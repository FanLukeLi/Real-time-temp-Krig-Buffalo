#      - SPARK_WORKER_MEMORY=2g
#      - SPARK_WORKER_CORES=2
#    ports:
#      - "7077:7077"
#      - "8081:8081"
#      - "4041:4041"
#      - "4042:4042"
#    volumes:
#      - spark-data:/opt/spark/work-dir

  spark-master:
    image: bitnami/spark:latest
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081"  # Spark master UI
      - "7077:7077"  # Spark master RPC
    command: ["/opt/bitnami/scripts/spark/run.sh"]
    networks:
      - spark-network

  spark-worker:
    image: bitnami/spark:latest
    environment:
        - SPARK_MODE=worker
        - SPARK_MASTER_URL=spark://spark-master:7077
        - SPARK_WORKER_MEMORY=2g
        - SPARK_WORKER_CORES=2
    ports:
      - "8082:8082"
      - "4040:4040"
    depends_on:
      - spark-master
    command: [ "/opt/bitnami/scripts/spark/run.sh" ]
    networks:
      - spark-network

  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=test
    volumes:
      - hadoop-namenode:/hadoop/dfs/name
    ports:
      - "9870:9870"

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    depends_on:
      - hadoop-namenode
    environment:
      - CLUSTER_NAME=test
    volumes:
      - hadoop-datanode:/hadoop/dfs/data
    ports:
      - "9864:9864"

  miniconda:
    build:
      context: ./
      dockerfile: Dockerfile
    volumes:
      - ./:/home/rt_temp_krig_bflo_app
    working_dir: /home/rt_temp_krig_bflo_app
    command: ["tail", "-f", "/dev/null"]
    networks:
      - spark-network
#    environment:
#      - PYTHONPATH=/opt/bitnami/spark/python:/opt/spark/python/lib/py4j-0.10.9.9-src.zip

volumes:
  kafka-data:
  spark-data:
  hadoop-namenode:
  hadoop-datanode:

networks:
  spark-network:
    driver: bridge
