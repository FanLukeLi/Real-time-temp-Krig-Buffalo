version: '3.9'

services:
  zookeeper:
    image: bitnami/zookeeper:latest
    container_name: zookeeper
    ports:
      - "2181:2181"
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
    volumes:
      - ./data/zookeeper:/bitnami/zookeeper
    networks:
      - spark-network

  kafka:
    image: bitnami/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_KRAFT_MODE=true
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CFG_LOG_DIRS=/bitnami/kafka/data
      - ALLOW_PLAINTEXT_LISTENER=yes
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"]
      interval: 30s
      timeout: 10s
      retries: 5
    depends_on:
      - zookeeper
    volumes:
      - ./data/kafka:/bitnami/kafka
    networks:
      - spark-network

  spark-master:
    image: bitnami/spark:latest
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_URL=spark://spark-master:7077
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_CORES=2
    ports:
      - "8081:8081"  # Spark master UI
      - "7077:7077"  # Spark master RPC
    command: ["/opt/bitnami/scripts/spark/run.sh"]
    networks:
      - spark-network

  spark-worker:
    image: bitnami/spark:latest
    environment:
        - SPARK_MODE=worker
        - SPARK_MASTER_URL=spark://spark-master:7077
        - SPARK_WORKER_MEMORY=2g
        - SPARK_WORKER_CORES=2
    ports:
      - "8082:8082"
      - "4040:4040"
    depends_on:
      - spark-master
    command: [ "/opt/bitnami/scripts/spark/run.sh" ]
    networks:
      - spark-network

  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    environment:
      - CLUSTER_NAME=test
    volumes:
      - hadoop-namenode:/hadoop/dfs/name
    ports:
      - "9870:9870"
    networks:
      - spark-network

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    depends_on:
      - hadoop-namenode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_CONF_dfs_replication=1
    volumes:
      - hadoop-datanode:/hadoop/dfs/data
    ports:
      - "9864:9864"
    networks:
        - spark-network

  miniconda:
    build:
      context: ./
      dockerfile: Dockerfile
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./:/home/rt_temp_krig_bflo_app
    working_dir: /home/rt_temp_krig_bflo_app
#    command: ["tail", "-f", "/dev/null"]
    command: ["conda", "run", "-n", "rtkrig", "flask", "run", "--host=0.0.0.0", "--port=5000"]
    networks:
      spark-network:
        aliases:
          - miniconda-host
    ports:
      - "5000:5000"
    hostname: miniconda-host

volumes:
  kafka-data:
  spark-data:
  hadoop-namenode:
  hadoop-datanode:

networks:
  spark-network:
    driver: bridge
